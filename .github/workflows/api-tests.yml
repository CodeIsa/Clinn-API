name: API Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create .env file for tests
      run: |
        echo "NODE_ENV=test" > .env
        echo "JWT_SECRET=test-secret-key" >> .env
        echo "PORT=3001" >> .env
    
    - name: Run API tests
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-key
        PORT: 3001
    
    - name: Generate test reports
      run: npm run test:report
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-key
        PORT: 3001
    
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-reports-${{ matrix.node-version }}
        path: reports/
        retention-days: 30
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            // Check if test report exists
            const reportPath = path.join(process.cwd(), 'reports', 'test-report.html');
            if (fs.existsSync(reportPath)) {
              const reportContent = fs.readFileSync(reportPath, 'utf8');
              
              // Extract test summary if possible
              const testSummary = '✅ API Tests completed successfully!';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🧪 API Tests Results\n\n${testSummary}\n\n📊 Test reports are available as artifacts.\n\n**Node.js Version:** ${matrix.node-version}\n**Workflow:** [API Tests](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            }
          } catch (error) {
            console.log('Could not comment on PR:', error.message);
          }
