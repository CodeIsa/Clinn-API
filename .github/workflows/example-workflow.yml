# Exemplo de como usar os workflows de teste
# Este arquivo pode ser deletado após a configuração

name: Example Workflow

on:
  workflow_dispatch: # Permite execução manual
  schedule:
    - cron: '0 2 * * 0' # Executa todo domingo às 2h da manhã

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
    - name: Example step
      run: echo "Este é um workflow de exemplo"
